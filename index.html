<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แผนที่ขอบเขตชุมชน เทศบาลตำบลตันหยงมัส</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <link href="https://fonts.googleapis.com/css2?family=Pridi:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    /* 🌟 กำหนดตัวแปรสี โทนสีเขียวมินิมอล (Flat & Clean) */
    :root {
      --primary: #4F6F52;       /* สีเขียวหลัก */
      --primary-hover: #3A4D39; /* สีเขียวเข้ม (ตอนชี้เมาส์) */
      --bg-main: #f8fafc;       /* พื้นหลังของหน้าเว็บ */
      --surface: #ffffff;       /* พื้นหลังของกล่อง/แถบเมนู */
      --text-dark: #1f2937;     /* สีข้อความหลัก */
      --text-muted: #64748b;    /* สีข้อความรอง */
      --border: #e2e8f0;        /* สีเส้นขอบบางๆ */
      --radius-sm: 8px;         /* ความโค้งมนแบบมินิมอล */
      --radius-md: 12px;
    }

    body { 
      margin: 0; padding: 0; font-family: 'Pridi', serif; 
      display: flex; flex-direction: column; height: 100vh; background-color: var(--bg-main); overflow: hidden;
      color: var(--text-dark);
    }

    /* 🌟 Navbar พื้นหลังสีเขียวแยกต่างหาก พร้อมไอคอนลายน้ำมุมขวา */
    .navbar {
      /* 1. กำหนดสีพื้นหลังใหม่ (สีเขียวสน/เขียวเข้ม) ที่แยกจากสีเขียวหลักของระบบ */
      background-color: #3C5A42; 
      
      /* 2. ไอคอนหมุดแผนที่จางๆ สำหรับทำลายน้ำ (Opacity 7%) */
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 5c-8.5 0-15.5 7-15.5 15.5 0 12 15.5 28.5 15.5 28.5s15.5-16.5 15.5-28.5C45.5 12 38.5 5 30 5zm0 21.5c-3.5 0-6.5-2.9-6.5-6.5s2.9-6.5 6.5-6.5 6.5 2.9 6.5 6.5-2.9 6.5-6.5 6.5z' fill='%23ffffff' fill-opacity='0.07'/%3E%3C/svg%3E");
      
      /* 3. จัดวางให้อยู่มุมขวาบน และไม่ให้ลายซ้ำกัน */
      background-repeat: no-repeat;
      background-position: right 5% top -20px; 
      background-size: 160px; /* ปรับขนาดลายน้ำให้ดูพอดี ไม่เล็กไม่ใหญ่เกินไป */
      
      padding: 14px 28px;
      display: flex; justify-content: space-between; align-items: center; gap: 15px;
      border-bottom: 1px solid rgba(0,0,0,0.15); /* ปรับสีเส้นขอบล่างให้เข้ากับพื้นหลังเข้ม */
      z-index: 1001;
    }

    .navbar-title { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    
    /* เพิ่มเงาบางๆ ให้โลโก้ดูโดดเด่นขึ้น */
    .nav-logo { height: 45px; width: auto; filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.25)); }
    
    .title-text { display: flex; align-items: center; }
    .title-text h1 { 
      margin: 0; font-size: 1.35rem; font-weight: 600; line-height: 1.2;
      color: #ffffff; /* 🌟 สีข้อความสีขาวเพื่อให้ตัดกับพื้นหลังสีเขียวเข้ม */
      white-space: nowrap; text-shadow: 0px 1px 3px rgba(0,0,0,0.3);
    }

    .navbar-right { display: flex; align-items: center; gap: 12px; flex-grow: 1; justify-content: flex-end; }

    /* 🌟 ช่องค้นหาโทนสว่าง กลมกลืน */
    .search-container { 
      display: flex; width: 100%; max-width: 320px; 
      background: var(--bg-main); border-radius: var(--radius-sm); 
      padding: 4px; transition: 0.2s; border: 1px solid transparent;
    }
    .search-container:focus-within { border-color: var(--primary); background: var(--surface); }
    
    .search-container input {
      flex-grow: 1; min-width: 0; padding: 8px 12px; border: none; background: transparent;
      font-family: 'Pridi', serif; font-size: 0.95rem; outline: none; color: var(--text-dark);
    }
    .search-container input::placeholder { color: #94a3b8; font-weight: 400; }
    
    .search-container button {
      background-color: var(--primary); color: white; border: none; padding: 8px 16px;
      border-radius: 6px; cursor: pointer; font-family: 'Pridi', serif; 
      font-weight: 500; transition: 0.2s; display: flex; align-items: center; gap: 6px;
    }
    .search-container button:hover { background-color: var(--primary-hover); }

    /* 🌟 ปุ่มกดแบบ Flat Design ไม่มีเงาขัดตา */
    .btn-action {
      border: none; padding: 10px 16px; font-family: 'Pridi', serif; font-size: 0.95rem; 
      border-radius: var(--radius-sm); cursor: pointer; transition: 0.2s; 
      display: flex; align-items: center; gap: 8px; font-weight: 500; white-space: nowrap; flex-shrink: 0;
    }
    
    .btn-measure { background-color: #f1f5f9; color: #475569; }
    .btn-measure:hover { background-color: #e2e8f0; color: var(--text-dark); }
    .btn-measure.active { background-color: #fee2e2; color: #ef4444; }

    .btn-admin { background-color: var(--primary); color: white; }
    .btn-admin:hover { background-color: var(--primary-hover); }
    .btn-admin.active { background-color: #10b981; }

    /* Sidebar มินิมอล */
    .content-area { display: flex; flex: 1; position: relative; min-height: 0; }
    
    .sidebar {
      width: 350px; flex-shrink: 0; background-color: var(--surface); border-right: 1px solid var(--border);
      z-index: 1000; transition: margin-left 0.3s ease; display: flex; flex-direction: column;
    }
    .sidebar.collapsed { margin-left: -351px; }
    .sidebar-inner { display: flex; flex-direction: column; height: 100%; width: 350px; }
    
    .sidebar-header {
      background-color: var(--surface); color: var(--primary-hover); padding: 20px;
      display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border);
    }
    .sidebar-header h3 { margin: 0; font-size: 1.1rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    
    .close-btn { 
      background: var(--bg-main); border: none; color: var(--text-muted); cursor: pointer; 
      width: 32px; height: 32px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center;
      transition: 0.2s; 
    }
    .close-btn:hover { background: #fee2e2; color: #ef4444; }
    
    .layer-list { padding: 15px; overflow-y: auto; flex-grow: 1; }
    .layer-list::-webkit-scrollbar { width: 6px; }
    .layer-list::-webkit-scrollbar-track { background: transparent; }
    .layer-list::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }

    .layer-group-container { 
      margin-bottom: 12px; background: var(--surface); border: 1px solid var(--border); 
      border-radius: var(--radius-md); overflow: hidden; transition: 0.2s;
    }
    .layer-group-container:hover { border-color: #cbd5e1; }
    
    .layer-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; }
    .main-layer-item { background-color: var(--bg-main); border-bottom: 1px solid var(--border); }
    .main-layer-item .layer-name { 
      font-weight: 600; color: var(--text-dark); cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 0.95rem;
    }
    .main-layer-item .layer-name i.toggle-arrow { color: var(--primary); transition: transform 0.2s ease; }
    
    .sub-layer-list { display: none; padding: 5px 0; }
    .sub-layer-list.open { display: block; }

    .sub-layer-item { padding: 8px 16px 8px 40px; border-bottom: 1px solid #f1f5f9; }
    .sub-layer-item:last-child { border-bottom: none; }
    .sub-layer-item .layer-name { font-size: 0.9rem; color: var(--text-muted); font-weight: 400; }
    
    .layer-actions { display: flex; gap: 10px; align-items: center; }
    .action-icon { 
      cursor: pointer; font-size: 0.9rem; color: #94a3b8; transition: 0.2s; 
      width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
      border-radius: 6px; background: var(--bg-main);
    }
    .action-icon:hover { background: #e2e8f0; color: var(--text-dark); }
    .action-icon.active-eye { color: var(--primary); background: #e8f5e9; }
    .action-icon.active-lock { color: #ef4444; background: #fee2e2; }
    
    .open-sidebar-btn {
      position: absolute; top: 15px; left: 15px; z-index: 999;
      background: var(--surface); color: var(--primary); border: 1px solid var(--border); padding: 10px 16px; 
      font-family: 'Pridi', serif; font-weight: 600; border-radius: var(--radius-sm); 
      cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.08); display: none; align-items: center; gap: 8px; font-size: 0.95rem;
      transition: 0.2s;
    }
    .open-sidebar-btn:hover { background: var(--bg-main); }

    #map { flex-grow: 1; width: 100%; z-index: 1; }

    .leaflet-popup-content-wrapper { border-radius: var(--radius-md) !important; box-shadow: 0 4px 15px rgba(0,0,0,0.1) !important; border: 1px solid var(--border); }
    .leaflet-popup-content { font-family: 'Pridi', serif !important; margin: 15px !important; }
    div:where(.swal2-container) div:where(.swal2-popup) { font-family: 'Pridi', serif !important; border-radius: var(--radius-md) !important; }
    
    .btn-text { display: inline; }

    /* 🌟 จัดระเบียบการแสดงผลบนมือถือให้พอดีเป๊ะ */
    @media (max-width: 850px) {
      .navbar { padding: 10px 15px; flex-direction: column; gap: 10px; align-items: stretch; }
      .navbar-title { justify-content: center; gap: 8px; width: 100%; }
      .nav-logo { height: 35px; } 
      .title-text h1 { font-size: clamp(1rem, 4vw, 1.25rem); }
      
      /* 🌟 เพิ่ม 3 บรรทัดนี้ เพื่อดันปุ่มควบคุมแผนที่ (ซูม/เลเยอร์) ให้หนีขอบจอมือถือ */
      .leaflet-bottom { bottom: 35px !important; }
      .leaflet-left { left: 10px !important; }
      .leaflet-right { right: 10px !important; }
      
      /* 🌟 ให้ช่องค้นหาและปุ่มไอคอน เรียงต่อกันในบรรทัดเดียว (ไม่ปัดตกบรรทัด) */
      .navbar-right { 
        width: 100%; display: flex; flex-wrap: nowrap; gap: 8px; justify-content: space-between;
      }
      
      /* 🌟 ช่องค้นหาขยายเต็มพื้นที่ที่เหลือ */
      .search-container { 
        flex: 1; max-width: none; 
      }
      .search-container input { padding: 8px 10px; font-size: 0.9rem; width: 100%; }
      .search-container button { padding: 8px 12px; }
      
      /* 🌟 ซ่อนข้อความในปุ่มทั้งหมด */
      .btn-text { display: none !important; }
      
      /* 🌟 บีบปุ่มให้เป็นรูปทรงสี่เหลี่ยมจัตุรัสแบบไอคอนเดี่ยวๆ */
      .btn-action { 
        width: 40px; height: 40px; padding: 0; 
        justify-content: center; flex-shrink: 0; font-size: 1.1rem;
      }
      /* เปลี่ยนปุ่มวัดให้กลืนกับพื้นหลัง ดูไม่รก */
      .btn-measure { 
        background-color: #f1f5f9; color: #475569; border: 1px solid var(--border);
      }
      
      .sidebar { position: absolute; height: 100%; z-index: 1002; width: 300px; }
      .sidebar.collapsed { margin-left: -301px; }
      .sidebar-inner { width: 300px; }
    }

    @media (max-width: 380px) {
      .title-text h1 { font-size: 0.95rem; }
      .nav-logo { height: 32px; }
      .btn-action { width: 36px; height: 36px; font-size: 1rem; }
    }
    /* 🌟 ปรับแต่งปุ่ม SweetAlert ให้เรียงแนวตั้งแบบ Modern UI */
    .vertical-actions-swal {
      display: flex !important;
      flex-direction: column !important;
      gap: 12px;
      width: 100%;
      margin-top: 5px;
    }
    .vertical-actions-swal button.swal2-styled {
      width: 90% !important;
      margin: 0 auto !important;
      padding: 12px 20px !important;
      border-radius: var(--radius-sm) !important;
      font-size: 1.05rem !important;
      font-weight: 500 !important;
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      gap: 12px !important;
      transition: 0.2s !important;
    }
    .vertical-actions-swal button.swal2-cancel {
      background-color: #f1f5f9 !important;
      color: #64748b !important;
    }
    .vertical-actions-swal button.swal2-cancel:hover {
      background-color: #e2e8f0 !important;
      color: #1e293b !important;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <div class="navbar-title">
      <img src="https://img2.pic.in.th/pic/71f81565dc59a7f9545542493a5514ab.png" alt="โลโก้เทศบาลตำบลตันหยงมัส" class="nav-logo">
      <div class="title-text">
        <h1>แผนที่ขอบเขตชุมชน เทศบาลตำบลตันหยงมัส</h1>
      </div>
    </div>
    
    <div class="navbar-right">
      <div class="search-container">
        <input type="text" id="searchInput" placeholder="ค้นหาชื่อชุมชน หรือสถานที่...">
        <button id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i></button>
      </div>
      <button id="measureBtn" class="btn-action btn-measure" title="เครื่องมือวัด"><i class="fa-solid fa-ruler-combined"></i> <span class="btn-text">วัดระยะ/พื้นที่</span></button>
      <button id="adminBtn" class="btn-action btn-admin" title="เข้าสู่ระบบแอดมิน"><i class="fa-solid fa-user-shield"></i> <span class="btn-text">แอดมิน</span></button>
    </div>
  </div>

  <div class="content-area">
    <div id="sidebar" class="sidebar collapsed">
      <div class="sidebar-inner">
        <div class="sidebar-header">
          <h3><i class="fa-solid fa-layer-group"></i> ชั้นข้อมูล (Layers)</h3>
          <button class="close-btn" id="closeSidebar" title="พับเก็บ"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="layerList" class="layer-list"></div>
      </div>
    </div>

    <button class="open-sidebar-btn" id="openSidebar" style="display: flex;">
      <i class="fa-solid fa-bars"></i> เปิดชั้นข้อมูล
    </button>

    <div id="map"></div>
  </div>

 <script>
    const MAP_CENTER = [6.29445, 101.72362];
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzN3IxvSwJEd2Zz3zhf53R0130SCEMPm4IEmhJPRy0rmgX-QsagZMhHTP7VTUyHi0u_/exec'; 
    const ADMIN_PASSWORD = "1234";

    const streetMap = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '© OpenStreetMap' });
    const satelliteMap = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { 
      maxZoom: 18, attribution: '© Esri' 
    });

    const map = L.map('map', { center: MAP_CENTER, zoom: 15, layers: [streetMap], zoomControl: false });
    L.control.zoom({ position: 'bottomleft' }).addTo(map);
    L.control.layers({ "🗺️ แผนที่ถนน": streetMap, "🛰️ แผนที่ดาวเทียม": satelliteMap }, null, { position: 'bottomright' }).addTo(map);

    const layerGroups = {}; 
    const lockedLayers = {}; 
    let highlightHalo = null; 
    let selectedLayer = null; 
    let allSearchableLayers = []; 

    document.getElementById('closeSidebar').onclick = () => {
      document.getElementById('sidebar').classList.add('collapsed');
      document.getElementById('openSidebar').style.display = 'flex'; 
      setTimeout(() => map.invalidateSize(), 300);
    };
    document.getElementById('openSidebar').onclick = () => {
      document.getElementById('sidebar').classList.remove('collapsed');
      document.getElementById('openSidebar').style.display = 'none'; 
      setTimeout(() => map.invalidateSize(), 300);
    };

    function renderSidebar() {
      const layerList = document.getElementById('layerList');
      layerList.innerHTML = '';

      Object.keys(layerGroups).forEach(sheetName => {
        let hasBoundary = layerGroups[sheetName]['🔲 ขอบเขตเทศบาล'] !== undefined;
        lockedLayers[sheetName] = hasBoundary; 

        const groupContainer = document.createElement('div');
        groupContainer.className = 'layer-group-container';

        const mainDiv = document.createElement('div');
        mainDiv.className = 'layer-item main-layer-item';

        const mainName = document.createElement('span');
        mainName.className = 'layer-name';
        mainName.innerHTML = `<i class="fa-solid fa-chevron-right toggle-arrow" style="width:15px"></i> ${sheetName}`;

        const mainActions = document.createElement('div');
        mainActions.className = 'layer-actions';

        const mainEyeIcon = document.createElement('span');
        mainEyeIcon.className = 'action-icon active-eye';
        mainEyeIcon.innerHTML = '<i class="fa-solid fa-eye"></i>'; 
        mainEyeIcon.title = "เปิด/ปิด ข้อมูลทั้งหมดในชุมชนนี้";

        const lockIcon = document.createElement('span');
        
        if (lockedLayers[sheetName]) {
          lockIcon.className = 'action-icon active-lock';
          lockIcon.innerHTML = '<i class="fa-solid fa-lock"></i>'; 
        } else {
          lockIcon.className = 'action-icon';
          lockIcon.innerHTML = '<i class="fa-solid fa-lock-open"></i>'; 
          lockIcon.title = "ล็อคการคลิกและแก้ไข";
        }

        mainActions.appendChild(mainEyeIcon);
        mainActions.appendChild(lockIcon);
        mainDiv.appendChild(mainName);
        mainDiv.appendChild(mainActions);

        const subListContainer = document.createElement('div');
        subListContainer.className = 'sub-layer-list'; 

        mainName.onclick = () => {
          subListContainer.classList.toggle('open');
          const arrow = mainName.querySelector('.toggle-arrow');
          if(subListContainer.classList.contains('open')) arrow.style.transform = 'rotate(90deg)';
          else arrow.style.transform = 'rotate(0deg)';
        };

        let isMainEyeOpen = true;
        const subCats = Object.keys(layerGroups[sheetName]);

        subCats.forEach(catName => {
          const subDiv = document.createElement('div');
          subDiv.className = 'layer-item sub-layer-item';

          const subName = document.createElement('span');
          subName.className = 'layer-name';
          subName.innerText = catName;

          const subActions = document.createElement('div');
          subActions.className = 'layer-actions';

          const subEyeIcon = document.createElement('span');
          subEyeIcon.className = 'action-icon active-eye';
          subEyeIcon.innerHTML = '<i class="fa-solid fa-eye"></i>';
          const safeId = `${sheetName}-${catName}`.replace(/\s+/g, '-');
          subEyeIcon.id = `eye-${safeId}`;

          subEyeIcon.onclick = () => {
            const group = layerGroups[sheetName][catName];
            if (map.hasLayer(group)) {
              map.removeLayer(group);
              subEyeIcon.innerHTML = '<i class="fa-solid fa-eye-slash"></i>'; 
              subEyeIcon.classList.remove('active-eye');
            } else {
              map.addLayer(group);
              subEyeIcon.innerHTML = '<i class="fa-solid fa-eye"></i>'; 
              subEyeIcon.classList.add('active-eye');
              if (lockedLayers[sheetName]) {
                group.eachLayer(layer => {
                  if (layer.getElement) layer.getElement().style.pointerEvents = 'none';
                  if (layer._icon) layer._icon.style.pointerEvents = 'none';
                });
              }
            }
          };

          subActions.appendChild(subEyeIcon);
          subDiv.appendChild(subName);
          subDiv.appendChild(subActions);
          subListContainer.appendChild(subDiv);
        });

        mainEyeIcon.onclick = () => {
          isMainEyeOpen = !isMainEyeOpen;
          if (isMainEyeOpen) {
            mainEyeIcon.innerHTML = '<i class="fa-solid fa-eye"></i>'; mainEyeIcon.classList.add('active-eye');
            subCats.forEach(catName => {
              const group = layerGroups[sheetName][catName];
              if (!map.hasLayer(group)) map.addLayer(group);
              const subEye = document.getElementById(`eye-${sheetName}-${catName}`.replace(/\s+/g, '-'));
              if(subEye) { subEye.innerHTML = '<i class="fa-solid fa-eye"></i>'; subEye.classList.add('active-eye'); }
            });
          } else {
            mainEyeIcon.innerHTML = '<i class="fa-solid fa-eye-slash"></i>'; mainEyeIcon.classList.remove('active-eye');
            subCats.forEach(catName => {
              const group = layerGroups[sheetName][catName];
              if (map.hasLayer(group)) map.removeLayer(group);
              const subEye = document.getElementById(`eye-${sheetName}-${catName}`.replace(/\s+/g, '-'));
              if(subEye) { subEye.innerHTML = '<i class="fa-solid fa-eye-slash"></i>'; subEye.classList.remove('active-eye'); }
            });
          }
        };

        lockIcon.onclick = () => {
          lockedLayers[sheetName] = !lockedLayers[sheetName];
          const isLocked = lockedLayers[sheetName];

          if (isLocked) { 
            lockIcon.innerHTML = '<i class="fa-solid fa-lock"></i>'; lockIcon.className = 'action-icon active-lock';
          } 
          else { 
            lockIcon.innerHTML = '<i class="fa-solid fa-lock-open"></i>'; lockIcon.className = 'action-icon';
          }

          subCats.forEach(catName => {
            layerGroups[sheetName][catName].eachLayer(layer => {
              if (layer.getElement && layer.getElement()) layer.getElement().style.pointerEvents = isLocked ? 'none' : 'auto';
              if (layer._icon) layer._icon.style.pointerEvents = isLocked ? 'none' : 'auto';
            });
          });

          if (isLocked && selectedLayer && selectedLayer.sheetName === sheetName) {
            resetHighlight(); map.closePopup();
          }
        };

        groupContainer.appendChild(mainDiv);
        groupContainer.appendChild(subListContainer);
        layerList.appendChild(groupContainer);

        if (lockedLayers[sheetName]) {
          setTimeout(() => {
            subCats.forEach(catName => {
              layerGroups[sheetName][catName].eachLayer(layer => {
                if (layer.getElement && layer.getElement()) layer.getElement().style.pointerEvents = 'none';
                if (layer._icon) layer._icon.style.pointerEvents = 'none';
              });
            });
          }, 500);
        }
      });
    }

    function resetHighlight() {
      if (highlightHalo) { map.removeLayer(highlightHalo); highlightHalo = null; }
      if (selectedLayer && selectedLayer.defaultStyle) { 
        selectedLayer.setStyle(selectedLayer.defaultStyle); selectedLayer = null; 
      }
    }

    map.on('click', resetHighlight);

    function triggerHighlight(layer) {
      if (lockedLayers[layer.sheetName]) return;
      resetHighlight();
      
      if (layer instanceof L.Marker) { map.flyTo(layer.getLatLng(), 17, { duration: 1.5 }); layer.openPopup(); return; }

      selectedLayer = layer;
      const isPolygon = selectedLayer instanceof L.Polygon;
      const currentWeight = selectedLayer.defaultStyle.weight || 2;
      const haloStyle = { color: '#4F6F52', weight: currentWeight + 5, opacity: 0.8, fill: false, dashArray: '' }; 

      if (isPolygon) highlightHalo = L.polygon(selectedLayer.getLatLngs(), haloStyle).addTo(map);
      else highlightHalo = L.polyline(selectedLayer.getLatLngs(), haloStyle).addTo(map);

      if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) { highlightHalo.bringToFront(); selectedLayer.bringToFront(); }
      if (selectedLayer.defaultStyle.fillOpacity > 0) selectedLayer.setStyle({ fillOpacity: 0.7 });

      map.flyToBounds(selectedLayer.getBounds(), { padding: [50, 50], maxZoom: 16, duration: 1.5 });
      selectedLayer.openPopup();
    }

    Swal.fire({ title: 'กำลังดึงข้อมูลแผนที่...', html: '<b>กรุณารอสักครู่</b>', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

    fetch(SCRIPT_URL)
      .then(response => response.json())
      .then(data => {
        data.forEach(item => {
          try {
            const latlngs = JSON.parse(item.coords);
            let mapLayer; let defaultStyle = {}; 
            
            let categoryName = '🟩 พื้นที่ชุมชน';
            if (item.type === 'marker') categoryName = '📍 สถานที่สำคัญ';
            else if (item.type === 'polyline') categoryName = '🛣️ ถนนในชุมชน';
            else if (item.type === 'boundary') categoryName = '🔲 ขอบเขตเทศบาล';

            if (item.type === 'marker') {
              let markerOptions = {};
              if (item.icon && item.icon.trim() !== "") {
                markerOptions.icon = L.icon({ iconUrl: item.icon, iconSize: [24, 24], iconAnchor: [16, 32], popupAnchor: [0, -32] });
              }
              mapLayer = L.marker(latlngs, markerOptions);
            } else {
              if (item.type === 'boundary') defaultStyle = { color: item.color || '#ef4444', weight: 4, dashArray: '10, 10', fillOpacity: 0 };
              else if (item.type === 'polyline') defaultStyle = { color: item.color, weight: 5, opacity: 0.9 };
              else defaultStyle = { color: item.color, fillColor: item.color, fillOpacity: 0.5, weight: 2 };
              
              mapLayer = item.type === 'polyline' ? L.polyline(latlngs, defaultStyle) : L.polygon(latlngs, defaultStyle);
              mapLayer.defaultStyle = defaultStyle;
            }
            
            mapLayer.sheetName = item.sheetName; 
            mapLayer.categoryName = categoryName; 
            mapLayer.bindPopup(`<div style="font-family:'Pridi', serif; font-size:14px; text-align:center; margin:5px 0;"><b>${item.name}</b><br><small style="color:#64748b">(${item.sheetName} - ${categoryName.substring(2)})</small></div>`);

            mapLayer.on('click', function(e) { L.DomEvent.stopPropagation(e); triggerHighlight(e.target); });

            if (!layerGroups[item.sheetName]) layerGroups[item.sheetName] = {};
            if (!layerGroups[item.sheetName][categoryName]) layerGroups[item.sheetName][categoryName] = L.layerGroup().addTo(map);
            
            layerGroups[item.sheetName][categoryName].addLayer(mapLayer);
            allSearchableLayers.push({ name: item.name, layer: mapLayer, sheetName: item.sheetName, catName: categoryName });

          } catch(e) { console.error("พิกัดไม่ถูกต้องสำหรับ: " + item.name); }
        });
        renderSidebar(); 
        Swal.close(); 
      })
      .catch(err => {
        Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อฐานข้อมูลได้', 'error');
      });

    // 🌟 ระบบค้นหาแบบใหม่ รองรับการค้นหาเจอหลายรายการ (เช่น ชื่อถนนซ้ำกัน) 🌟
    function executeSearch() {
      const searchValue = document.getElementById('searchInput').value.trim().toLowerCase();
      if(!searchValue) return;

      // ใช้ .filter() แทน .find() เพื่อเก็บข้อมูล "ทั้งหมด" ที่ตรงกับคำค้นหา
      const results = allSearchableLayers.filter(item => item.name.toLowerCase().includes(searchValue));
      
      if (results.length === 0) {
        Swal.fire({ title: 'ไม่พบข้อมูล!', text: 'ลองเปลี่ยนคำค้นหาดูนะครับ', icon: 'warning', confirmButtonColor: '#4F6F52' }); 
        return;
      }

      // ถ้าเจอแค่ 1 รายการ ให้บินไปดูได้เลยเหมือนเดิม
      if (results.length === 1) {
        openSearchResult(results[0]);
      } 
      // ถ้าเจอมากกว่า 1 รายการ ให้แสดง Popup ให้เลือก
      else {
        let htmlContent = '<div style="text-align: left; max-height: 250px; overflow-y: auto; padding-right: 5px;">';
        
        results.forEach((res, index) => {
          htmlContent += `
            <div onclick="selectSearchResult(${index})" 
                 style="padding: 12px; margin-bottom: 8px; background: #f8fafc; border: 1px solid #e2e8f0; 
                        border-radius: 8px; cursor: pointer; transition: 0.2s; box-shadow: 0 1px 2px rgba(0,0,0,0.05);"
                 onmouseover="this.style.borderColor='#4F6F52'; this.style.backgroundColor='#e8f5e9'"
                 onmouseout="this.style.borderColor='#e2e8f0'; this.style.backgroundColor='#f8fafc'">
              <div style="font-weight: 600; color: #1f2937;">${res.name}</div>
              <div style="font-size: 0.85rem; color: #64748b; margin-top: 4px;">
                <i class="fa-solid fa-map-location-dot" style="color: #4F6F52;"></i> ชุมชน: ${res.sheetName} <br>
                <i class="fa-solid fa-layer-group" style="color: #4F6F52;"></i> ประเภท: ${res.catName.substring(2)}
              </div>
            </div>
          `;
        });
        htmlContent += '</div>';

        // เก็บผลลัพธ์ไว้ชั่วคราวเพื่อรอการคลิก
        window.tempSearchResults = results;

        Swal.fire({
          title: '<span style="font-size:1.2rem; color:#4F6F52;">พบหลายรายการ</span>',
          html: '<div style="font-size:0.9rem; color:#64748b; margin-bottom:15px;">กรุณาคลิกเลือกรายการที่คุณต้องการ:</div>' + htmlContent,
          showConfirmButton: false, 
          showCancelButton: true,
          cancelButtonText: 'ยกเลิก',
          cancelButtonColor: '#94a3b8'
        });
      }
    }

    // ฟังก์ชันย่อยสำหรับรับค่าเมื่อถูกคลิกจาก Popup
    window.selectSearchResult = function(index) {
      Swal.close(); 
      openSearchResult(window.tempSearchResults[index]); 
    };

    // ฟังก์ชันย่อยจัดการการแสดงผลบนแผนที่
    function openSearchResult(result) {
      const targetGroup = layerGroups[result.sheetName][result.catName];
      if (!map.hasLayer(targetGroup)) {
        map.addLayer(targetGroup);
        const safeId = `${result.sheetName}-${result.catName}`.replace(/\s+/g, '-');
        const eyeIcon = document.getElementById(`eye-${safeId}`);
        if(eyeIcon) { eyeIcon.innerHTML = '<i class="fa-solid fa-eye"></i>'; eyeIcon.classList.add('active-eye'); }
      }

      if (lockedLayers[result.sheetName]) {
         Swal.fire({
           title: 'หมวดนี้ถูกล็อคอยู่',
           html: `พบ <b>${result.name}</b><br>แต่คุณต้องปลดล็อค (กุญแจ) ในเมนูด้านซ้ายก่อน จึงจะคลิกดูรายละเอียดได้`,
           icon: 'info', timer: 4000, showConfirmButton: false, position: 'top-end', toast: true
         });
         if (result.layer instanceof L.Marker) map.flyTo(result.layer.getLatLng(), 17);
         else map.flyToBounds(result.layer.getBounds(), { padding: [50, 50], maxZoom: 16 });
      } else {
         triggerHighlight(result.layer);
      }
    }

    document.getElementById('searchBtn').addEventListener('click', executeSearch);
    document.getElementById('searchInput').addEventListener('keypress', function (e) { if (e.key === 'Enter') executeSearch(); });

    let isMeasureMode = false;
    let currentMeasureDrawer = null;
    const measureLayerGroup = new L.FeatureGroup().addTo(map);

    function startMeasureMode() {
      measureLayerGroup.clearLayers(); 
      isMeasureMode = true;
      currentMeasureDrawer.enable(); 
      document.getElementById('measureBtn').innerHTML = '<i class="fa-solid fa-times"></i> <span class="btn-text">ยกเลิกการวัด</span>';
      document.getElementById('measureBtn').classList.add('active');
    }

    document.getElementById('measureBtn').addEventListener('click', () => {
      if (isMeasureMode) {
        if(currentMeasureDrawer) currentMeasureDrawer.disable();
        isMeasureMode = false;
        document.getElementById('measureBtn').innerHTML = '<i class="fa-solid fa-ruler-combined"></i> <span class="btn-text">วัดระยะ/พื้นที่</span>';
        document.getElementById('measureBtn').classList.remove('active');
        measureLayerGroup.clearLayers(); 
      } else {
        Swal.fire({
          title: '<b style="color: var(--primary); font-size: 1.25rem;">เลือกเครื่องมือวัด</b>',
          html: '<span style="color: var(--text-muted); font-size: 0.9rem;">คลิกเลือกรูปแบบที่ต้องการใช้งาน</span>',
          width: '300px',         
          padding: '1.5em 1em',   
          showDenyButton: true,
          showCancelButton: true,
          confirmButtonText: '<i class="fa-solid fa-route" style="font-size:1.1rem;"></i> วัดระยะทาง',
          denyButtonText: '<i class="fa-solid fa-draw-polygon" style="font-size:1.1rem;"></i> วัดพื้นที่',
          cancelButtonText: 'ปิดหน้าต่าง',
          confirmButtonColor: 'var(--primary)', 
          denyButtonColor: '#3b82f6', 
          customClass: { 
            actions: 'vertical-actions-swal' 
          }
        }).then((result) => {
          if (result.isConfirmed) {
            currentMeasureDrawer = new L.Draw.Polyline(map, { shapeOptions: { color: '#4F6F52', weight: 5, dashArray: '5, 5' } });
            startMeasureMode();
          } else if (result.isDenied) {
            currentMeasureDrawer = new L.Draw.Polygon(map, { shapeOptions: { color: '#4F6F52', weight: 3, fillOpacity: 0.3 } });
            startMeasureMode();
          }
        });
      }
    });

    const drawnItems = new L.FeatureGroup(); map.addLayer(drawnItems);
    const drawControl = new L.Control.Draw({ edit: { featureGroup: drawnItems }, draw: { polygon: true, polyline: true, marker: true, rectangle: false, circle: false, circlemarker: false } });

    map.on(L.Draw.Event.CREATED, function (event) {
      const layer = event.layer; 
      const type = event.layerType; 
      
      if (isMeasureMode) {
        measureLayerGroup.addLayer(layer);
        
        if (type === 'polyline') {
          let latlngs = layer.getLatLngs();
          let distance = 0;
          for (let i = 0; i < latlngs.length - 1; i++) distance += latlngs[i].distanceTo(latlngs[i + 1]);
          let txt = distance > 1000 ? (distance/1000).toFixed(2) + ' กิโลเมตร' : distance.toFixed(0) + ' เมตร';
          layer.bindPopup(`<div style="font-family:'Pridi', serif; text-align:center;"><b>📏 ระยะทางรวม:</b><br><span style="font-size:1.1rem; color:#4F6F52; font-weight:600;">${txt}</span></div>`).openPopup();
        } 
        else if (type === 'polygon') {
          let latlngs = layer.getLatLngs()[0];
          let area = L.GeometryUtil.geodesicArea(latlngs);
          let rai = Math.floor(area / 1600);
          let remainderArea = area % 1600;
          let ngan = Math.floor(remainderArea / 400);
          let sqwa = (remainderArea % 400) / 4;
          layer.bindPopup(`<div style="font-family:'Pridi', serif; text-align:center;"><b>📐 พื้นที่รวม:</b><br>${area.toFixed(0)} ตารางเมตร<br><hr style="margin:5px 0; border:0; border-top:1px dashed #eee;"><span style="color:#ef4444; font-weight:600;">${rai} ไร่ ${ngan} งาน ${sqwa.toFixed(1)} ตร.ว.</span></div>`).openPopup();
        }

        isMeasureMode = false;
        document.getElementById('measureBtn').innerHTML = '<i class="fa-solid fa-ruler-combined"></i> <span class="btn-text">วัดระยะ/พื้นที่</span>';
        document.getElementById('measureBtn').classList.remove('active');

      } else {
        let coordsArray;
        if (type === 'polygon') coordsArray = layer.getLatLngs()[0].map(point => [point.lat, point.lng]);
        else if (type === 'polyline') coordsArray = layer.getLatLngs().map(point => [point.lat, point.lng]);
        else if (type === 'marker') coordsArray = [layer.getLatLng().lat, layer.getLatLng().lng];
        
        const coordsString = JSON.stringify(coordsArray);
        let typeTH = type === 'polygon' ? 'พื้นที่' : (type === 'polyline' ? 'เส้นถนน' : 'จุดสถานที่');
        
        Swal.fire({
          title: `บันทึก${typeTH}`,
          html: `<p style="font-size:0.95rem; color:#64748b;">คัดลอกพิกัดด้านล่างไปวางใน <b>ช่อง C</b> <br>และพิมพ์คำว่า <b style="color:#4F6F52;">${type}</b> ใน <b>ช่อง D</b></p>`,
          input: 'textarea', inputValue: coordsString,
          showCancelButton: true, confirmButtonText: '<i class="fa-solid fa-copy"></i> คัดลอก', cancelButtonText: 'ปิด',
          confirmButtonColor: '#10b981', cancelButtonColor: '#94a3b8',
          customClass: { confirmButton: 'btn-action', cancelButton: 'btn-action' },
          didOpen: () => {
            const input = Swal.getInput();
            input.style.height = '120px'; input.style.borderRadius = '8px'; input.setAttribute('readonly', true);
          }
        }).then((result) => {
          if (result.isConfirmed) {
            navigator.clipboard.writeText(coordsString).then(() => {
              Swal.fire({ icon: 'success', title: 'คัดลอกแล้ว', timer: 1500, showConfirmButton: false });
            });
          }
        });
        drawnItems.addLayer(layer);
      }
    });

    let isAdmin = false;
    document.getElementById('adminBtn').addEventListener('click', () => {
      if (isAdmin) { 
        Swal.fire({ title: 'โหมดแอดมิน', text: 'คุณสามารถวาดแผนที่จากแถบเครื่องมือด้านซ้ายได้เลย', icon: 'info', confirmButtonColor: '#4F6F52' }); 
        return; 
      }
      
      Swal.fire({
        title: 'ระบบจัดการแผนที่',
        text: 'กรุณาใส่รหัสผ่านเพื่อเข้าสู่โหมดแอดมิน',
        input: 'password', inputPlaceholder: 'รหัสผ่าน...',
        showCancelButton: true, confirmButtonText: 'ตกลง', cancelButtonText: 'ยกเลิก',
        confirmButtonColor: '#4F6F52', cancelButtonColor: '#94a3b8',
        customClass: { confirmButton: 'btn-action', cancelButton: 'btn-action' }
      }).then((result) => {
        if (result.isConfirmed) {
          if (result.value === ADMIN_PASSWORD) {
            isAdmin = true; map.addControl(drawControl); 
            const btn = document.getElementById('adminBtn');
            btn.innerHTML = '<i class="fa-solid fa-user-shield"></i> <span class="btn-text">แอดมิน (แก้ไข)</span>'; 
            btn.classList.add('active');
            Swal.fire({ icon: 'success', title: 'เข้าสู่ระบบสำเร็จ', timer: 1500, showConfirmButton: false });
          } else { 
            Swal.fire({ title: 'รหัสผ่านผิด!', icon: 'error', confirmButtonColor: '#ef4444' }); 
          }
        }
      });
    });
  </script>
</body>
</html>
